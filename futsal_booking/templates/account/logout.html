{% extends 'base.html' %}

{% block title %}Sign Out - Futsal Booking System{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow mt-5">
                <div class="card-header bg-success text-white text-center">
                    <h3 class="mb-0"><i class="bi bi-box-arrow-right"></i> Sign Out</h3>
                </div>
                <div class="card-body p-5 text-center">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                    <h4 class="mt-4 mb-3">You've been signed out</h4>
                    <p class="text-muted">Thank you for using our futsal booking system!</p>
                    
                    <div class="d-grid gap-2 mt-4">
                        <a href="{% url 'home' %}" class="btn btn-success">
                            <i class="bi bi-house"></i> Go to Home
                        </a>
                        <a href="{% url 'account_login' %}" class="btn btn-outline-success">
                            <i class="bi bi-box-arrow-in-right"></i> Sign In Again
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
